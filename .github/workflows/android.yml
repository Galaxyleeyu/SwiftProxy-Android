name: Android Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftproxy-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode build-assets/swiftproxy_icon.jpg.b64 > app/src/main/res/drawable-nodpi/swiftproxy_icon.jpg

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Run libbox emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 4
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -partition-size 4096 -wipe-data
          disable-animations: true
          script: gradle connectedDebugAndroidTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwiftProxy-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
