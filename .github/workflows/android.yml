name: Android Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode build-assets/swiftproxy_icon.jpg.b64 > app/src/main/res/drawable-nodpi/swiftproxy_icon.jpg

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwiftProxy-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
